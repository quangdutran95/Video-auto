[metadata]
title = "Có những người không ngã vì kém — bài học về sự khiêm nhường"
language = "vi"
platform = "tiktok"
target_duration_seconds = 168
aspect_ratio = "9:16"

[creative]
audience = "Người trưởng thành, đặc biệt những ai đang trên đà thành công"
goal = "Nhắc nhở về sự kiêu ngạo khi lên cao và bài học về khiêm nhường thực sự"
emotional_arc = ["hook", "build", "turn", "resolution"]
tone = "reflective"
cta = ""

[voiceover]
script = """
Có những người không ngã vì kém.
Họ ngã vì lúc lên cao đã quên cách cúi đầu.
Khi còn ở dưới, ai cũng biết cẩn thận.
Nói một câu cũng nghĩ trước nghĩ sau.
Làm một việc cũng sợ mình sai.
Nhưng khi có chút thành tựu, có chút tiền, có chút vị trí, nhiều người bắt đầu đổi giọng.
Họ nói chuyện cao hơn.
Nhìn người khác thấp hơn.
Và nghĩ rằng những người im lặng là những người không đáng bận tâm.
Nhưng đời lạ lắm.
Người bạn xem nhẹ hôm nay, có khi lại là người chứng kiến bạn trượt chân ngày mai.
Lúc bạn đang thuận, không ai nói gì.
Không có nghĩa là họ không thấy.
Một câu khinh người.
Một lần làm người khác mất mặt.
Một thái độ xem thường.
Tất cả đều được người ta ghi lại, chỉ là họ chưa cần nói ra.
Đến khi thời vận đổi chiều, bạn mới hiểu:
Không phải ai cũng muốn đẩy bạn ngã.
Nhưng người từng bị bạn coi nhẹ cũng không còn lý do để đưa tay đỡ bạn.
Khiêm nhường không phải là yếu.
Khiêm nhường là biết mình đang đứng ở đâu, và biết dưới chân mình vẫn còn đường dài.
Người thật sự từng trải thường không ồn ào.
Giỏi, họ không cần khoe hết.
Có tiền, họ không cần làm người khác thấy nhỏ lại.
Có vị thế, họ càng giữ lời nói chừng mực hơn.
Không phải vì họ thiếu thứ để thể hiện.
Mà vì họ hiểu: càng nổi bật, càng dễ bị soi. Càng cao giọng, càng dễ tự tạo đối thủ.
Sống biết chừa đường lui không phải là tính toán.
Đó là khôn ngoan.
Là khi thắng cũng không dồn người khác vào đường cùng.
Khi hơn cũng không cần ép ai phải cúi đầu.
Khi đi lên vẫn nhớ giữ lại một chút tử tế cho ngày mình đi xuống.
Bởi đường đời không phải lúc nào cũng thẳng.
Có lúc tiến.
Có lúc dừng.
Và có lúc, lùi một bước lại giúp bạn giữ được nhiều thứ hơn là cố bước thêm một bước.
Đến cuối cùng, người đi được đường dài không phải người lúc nào cũng tiến lên.
Mà là người biết khi nào nên tiến, khi nào nên im lặng, và khi nào nên lùi để đứng vững lâu hơn.
"""
delivery = "trầm, rõ, chậm — giọng người đã từng trải và thấu hiểu"

# NOTE: start_hint/end_hint ước tính ~2.5 từ/giây.
# Chạy timestamp_resolver.py sau khi có transcript để gắn timestamp chính xác.

